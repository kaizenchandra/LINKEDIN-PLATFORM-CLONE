server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
spring:
  session:
    jdbc:
      initialize-schema: never
  datasource:
    url: jdbc:postgresql://localhost:15432/meridian
    username: meridian
    password: ${DB_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: meridian
            client-secret: ${OIDC_SECRET}
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://localhost:28080/realms/meridian
  mvc:
    problemdetails:
      enabled: true

management:
  server:
    port: 9091
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: meridian-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true

meridian:
  events:
    enabled: ${EVENTS_ENABLED:true}
    bootstrap: ${KAFKA_BOOTSTRAP:localhost:19092}
  realtime:
    origin: ${REALTIME_ORIGIN:http://localhost:3100}
