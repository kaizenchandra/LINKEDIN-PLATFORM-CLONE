groups:
  - name: meridian-local
    rules:
      - alert: BackendScrapeUnavailable
        expr: up{job="meridian-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Backend metrics scrape has failed for one minute
      - alert: BackendHighErrorRate
        expr: (sum(rate(http_server_requests_seconds_count{job="meridian-backend",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{job="meridian-backend"}[5m])) > 0.05) and (sum(increase(http_server_requests_seconds_count{job="meridian-backend"}[5m])) >= 20)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Backend error rate is above five percent
