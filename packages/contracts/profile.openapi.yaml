      responses:
        '204': {description: Deleted}
        '409': {description: Entry unavailable or stale version}
  /logout:
    post:
      operationId: logout
      description: CSRF-protected browser form POST. Invalidates the application session and redirects to Keycloak end-session endpoint. Browser ends on the identity provider signed-out page.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [_csrf]
              properties:
                _csrf: {type: string}
      responses:
        '302': {description: Redirect to identity provider logout}
        '403': {description: Missing or invalid CSRF token}
  /me/preferences:
    get:
      operationId: getMyPreferences
      responses:
        '200':
          description: Account preferences, defaults initialized on first read
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preferences'}
        '401': {description: Authentication required}
        '409': {description: Profile must be initialized first}
    put:
      operationId: updateMyPreferences
      description: Owner-only compare-and-swap; read-your-writes consistency; no automatic retry on conflict.
      parameters:
        - {in: header, name: X-CSRF-TOKEN, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Preferences'}
      responses:
        '200':
          description: Saved preferences
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preferences'}
        '400': {description: Invalid theme or version}
        '401': {description: Authentication required}
        '403': {description: Missing or invalid CSRF token}
        '409': {description: Stale preferences; reload and retry}
  /me/visibility:
    get:
      operationId: getMyVisibility
      responses:
        '200':
          description: Own sharing state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Visibility'}
    put:
      operationId: updateMyVisibility
      description: Owner-only versioned opt-in. Requires CSRF header. New reads immediately enforce confirmed state.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VisibilityUpdate'}
      responses:
        '200':
          description: Persisted state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Visibility'}
        '409': {description: Stale version or missing self profile}
  /me/sessions:
    get:
      operationId: listMySessions
      description: Authenticated caller's active Meridian sessions (newest 100). IDs are noncredential management IDs. No IP address, tokens, cookies or identity-provider sessions returned. No-store.
      responses:
        '200':
          description: Active application sessions
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AccountSession'}}
        '401': {description: Authentication required}
    delete:
      operationId: revokeAllMySessions
      description: CSRF-protected atomic deletion of all currently persisted Meridian sessions for the caller, including current. New sign-ins after this transaction remain possible and require interactive identity-provider authentication. Does not revoke Keycloak SSO sessions or credentials. In-flight requests may finish; subsequent requests fail authentication; sockets close within five seconds. Audit commits with deletion.
      responses:
        '204': {description: Sessions revoked}
        '401': {description: Authentication required}
        '403': {description: CSRF rejected}
  /me/sessions/{id}:
    delete:
      operationId: revokeMySession
      description: Owner-scoped, CSRF-protected revocation using noncredential management ID. Missing or foreign ID returns 204 without changes. Retrying is idempotent. No-store. Current session may be revoked; next request must sign in.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Session absent or revoked}
        '400': {description: Invalid management ID}
        '401': {description: Authentication required}
        '403': {description: CSRF rejected}
  /me/photo:
    get:
      operationId: getMyProfilePhoto
      responses:
        '200':
          description: Normalized PNG, no-store
          content:
            image/png:
              schema: {type: string, format: binary}
        '404': {description: No photo}
        '503': {description: Private object storage unavailable}
    put:
      operationId: uploadMyProfilePhoto
      description: Session and CSRF required. Owner-only replacement; last successful write wins. Maximum 2 MiB, JPEG or PNG, at most 4096 pixels per side and 16 megapixels. Re-encoded PNG at most 512 pixels per side, without source metadata. Read-your-writes persistence. Optional private S3 objects are published only after storage succeeds; prior photo remains authoritative if storage fails. Storage keys are never exposed.
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, format: binary}
          image/jpeg:
            schema: {type: string, format: binary}
      responses:
        '204': {description: Photo persisted}
        '401': {description: Sign in required}
        '403': {description: CSRF rejected}
        '409': {description: Profile not initialized or upload expired}
        '413': {description: File too large}
        '422': {description: Invalid image or dimensions}
        '503': {description: Storage write failed; current photo remains unchanged}
    delete:
      operationId: removeMyProfilePhoto
      description: Session and CSRF required. Idempotent owner-only removal. Visibility ends immediately; unreferenced S3 objects are collected asynchronously.
      responses:
        '204': {description: Photo removed}
  /profiles/{id}/photo:
    get:
      operationId: getVisibleProfilePhoto
      security: []
      description: Same public/member/owner visibility and blocking rules as the profile summary. No-store on every read.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Normalized PNG
          content:
            image/png:
              schema: {type: string, format: binary}
        '401': {description: Guest must sign in}
        '404': {description: Unavailable profile or photo}
        '503': {description: Private object storage unavailable}
  /profile-login/{id}:
    get:
      operationId: signInForProfile
      security: []
      description: Stores a UUID-only profile return target in the server session and redirects to OIDC login. Successful login consumes the target. No arbitrary redirect URLs accepted.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '302': {description: Redirect to identity provider authorization entry point}
        '400': {description: Invalid profile identifier}
  /profiles/{id}:
    get:
      operationId: getMemberSummary
      security: []
      description: Anonymous visitors see explicitly public summaries only; otherwise 401. Signed-in members see public or member-visible summaries, subject to blocking. Owner can see own summary. No contact or credential data. No-store response.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Visible summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberSummary'}
        '401': {description: Authentication required}
        '404': {description: Missing or private profile}
  /network:
    get:
      operationId: getMyNetwork
      responses:
        '200':
          description: Own pending requests and accepted connections
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Connection'}}
    post:
      operationId: requestConnection
      description: CSRF required. New invitations require a visible member summary. Reusing the same UUID with the same sender/recipient returns 204 without effects, even after state advancement, unless currently blocked. Different UUIDs for an active unordered pair or mismatched ownership/recipient conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, recipientId]
              properties:
                id: {type: string, format: uuid}
                recipientId: {type: string, format: uuid}
      responses:
        '204': {description: Request persisted}
        '409': {description: Duplicate, self-request or unavailable recipient}
  /network/{id}:
    put:
      operationId: transitionConnection
      description: CSRF and expected version required. Recipient accepts/ignores; sender withdraws; either party removes accepted connection. An authorized replay of the immediately completed action/version returns 204 without another event. Later state advancement makes older retries conflict.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, version]
              properties:
                action: {type: string, enum: [ACCEPT, IGNORE, WITHDRAW, REMOVE]}
                version: {type: integer, format: int64, minimum: 0}
      responses:
        '204': {description: Transition committed}
        '409': {description: Stale, unavailable or unauthorized transition}
  /blocks:
    get:
      operationId: listMyBlocks
      responses:
        '200':
          description: Only blocks created by current member
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Block'}}
    post:
      operationId: blockMember
      description: CSRF required. Idempotent block. Closes active relationships and denies summary reads/invitations in both directions. Target must be visible or have relationship history with actor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId]
              properties:
                memberId: {type: string, format: uuid}
      responses:
        '204': {description: Block committed}
        '404': {description: Target unavailable or self}
  /blocks/{id}:
    delete:
      operationId: unblockMember
      description: CSRF required. Removes only caller-owned block; never restores relationships.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Caller block absent}
  /csrf:
    get:
      operationId: getCsrfToken
      responses:
        '200':
          description: Session-bound CSRF token
          content:
            application/json:
              schema:
                type: object
                required: [token, header]
                properties:
                  token: {type: string}
                  header: {type: string}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: JSESSIONID
  schemas:
    CommunityDraft:
      type: object
      required: [id, kind, title, description, startsAt, location]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [GROUP, EVENT, NEWSLETTER]}
        title: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 3000}
        startsAt: {type: [string, 'null'], format: date-time}
        location: {type: string, maxLength: 240}
    CommunityEntry:
      allOf:
        - {$ref: '#/components/schemas/CommunityDraft'}
        - type: object
          required: [joined, members, owned]
          properties:
            joined: {type: boolean}
            members: {type: integer, format: int64}
            owned: {type: boolean}
    NetworkUpdate:
      type: object
      required: [id, memberId, name, text, createdAt]
      properties:
        id: {type: string, format: uuid}
        memberId: {type: string, format: uuid}
        name: {type: string}
        text: {type: string}
        createdAt: {type: string, format: date-time}
    SearchHistoryEntry:
      type: object
      required: [id, kind, query, location, searchedAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [people, companies, jobs, posts]}
        query: {type: string}
        location: {type: string}
        searchedAt: {type: string, format: date-time}
    SearchHistoryState:
      type: object
      required: [enabled, version, items]
