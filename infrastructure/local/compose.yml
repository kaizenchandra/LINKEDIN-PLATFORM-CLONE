services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
  keycloak:
    extra_hosts: ["host.docker.internal:host-gateway"]
    image: meridian-keycloak:26.4.2
    build:
      context: ../identity
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:28080", "--spi-theme-selector--provider=meridian"]
    environment:
      KC_HEALTH_ENABLED: "true"
      MERIDIAN_LOCAL_IDENTITY_POLICY: "true"
      MERIDIAN_LOCAL_BACKCHANNEL_URL: ${MERIDIAN_LOCAL_BACKCHANNEL_URL:-http://host.docker.internal:8081/logout/connect/back-channel/keycloak}
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30
    ports: ["127.0.0.1:${KEYCLOAK_PORT:-28080}:8080"]
    volumes: ["./realm.json:/opt/keycloak/data/import/realm.json:ro", "keycloak:/opt/keycloak/data"]
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    profiles: [app, events]
    image: apache/kafka:4.1.2
    ports: ["127.0.0.1:${KAFKA_PORT:-19092}:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30
  backend:
    profiles: [app]
    build:
      context: ../../apps/backend
    environment:
      REALTIME_ORIGIN: http://localhost:3100
      KAFKA_BOOTSTRAP: kafka:9092
      SPRING_PROFILES_ACTIVE: local-container
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/meridian
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      OIDC_SECRET: ${OIDC_SECRET:?Set OIDC_SECRET}
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'GET /readyz HTTP/1.0\r\n\r\n' >&0; grep '200'; } 0<>/dev/tcp/localhost/8081"
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
  web:
    profiles: [app]
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_REALTIME_URL: ws://localhost:8081/api/v1/realtime
    ports: ["127.0.0.1:3100:3100"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    ports: ["127.0.0.1:19090:9090"]
    volumes:
      - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../../observability/alerts.test.yml:/etc/prometheus/alerts.test.yml:ro
      - prometheus:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres:
  keycloak:
  prometheus:
  kafka:
